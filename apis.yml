aid: automat
name: Automat
description: >-
  Automat builds AI agents that operate computers the way people do, replacing legacy RPA tools
  like UiPath, Automation Anywhere, and Blue Prism with intelligent, self-healing managed
  automations. Founded in 2022 by ex-Google engineers, the platform combines UI-based AI agents
  (RPA using Computer Use), AI document extraction (IDP with vision language models), and
  API-based automations (iPaaS) into unified workflows delivered as a managed service. Automat
  exposes a REST Extract API (studio.runautomat.com) for pulling structured data from PDFs,
  images, and other documents against a configured extractor, plus a hosted MCP server for AI
  client integration. Used across banking, mortgage and lending, insurance, manufacturing,
  healthcare, and e-commerce operations, with SOC 2, GDPR, HIPAA, and ISO 27001 certification.
